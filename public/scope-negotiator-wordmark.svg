<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Scope Negotiator</title>
  <desc id="desc">Retro pixel block Scope Negotiator wordmark with cream faces and black extruded depth.</desc>
  <defs>
    <filter id="outline" x="-20%" y="-20%" width="140%" height="160%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="dilate"/>
      <feFlood flood-color="#171717" result="ink"/>
      <feComposite in="ink" in2="dilate" operator="in" result="stroke"/>
      <feMerge><feMergeNode in="stroke"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.35" fill="#171717" opacity=".28"/>
    </pattern>
    <style>
      .face { fill:#f6f0e7; stroke:#171717; stroke-width:5; stroke-linejoin:miter; paint-order:stroke fill; }
      .depth { fill:#171717; stroke:#171717; stroke-width:5; stroke-linejoin:miter; }
      .word { font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-weight:900; letter-spacing:-5px; }
    </style>
  </defs>

  <!-- restrained halftone cast shadow -->
  <path d="M115 195 L950 195 L1075 315 L1075 470 L250 470 L115 350 Z" fill="url(#dots)" opacity=".55"/>

  <!-- stepped extrusion: solid translated silhouettes -->
  <g class="word depth" font-size="178">
    <text x="98" y="196" transform="translate(34 34)">SCOPE</text>
    <text x="98" y="382" transform="translate(34 34)" font-size="164">NEGOTIATOR</text>
  </g>
  <g class="word depth" font-size="178">
    <text x="98" y="196" transform="translate(28 28)">SCOPE</text>
    <text x="98" y="382" transform="translate(28 28)" font-size="164">NEGOTIATOR</text>
  </g>
  <g class="word depth" font-size="178">
    <text x="98" y="196" transform="translate(22 22)">SCOPE</text>
    <text x="98" y="382" transform="translate(22 22)" font-size="164">NEGOTIATOR</text>
  </g>
  <g class="word depth" font-size="178">
    <text x="98" y="196" transform="translate(16 16)">SCOPE</text>
    <text x="98" y="382" transform="translate(16 16)" font-size="164">NEGOTIATOR</text>
  </g>
  <g class="word depth" font-size="178">
    <text x="98" y="196" transform="translate(10 10)">SCOPE</text>
    <text x="98" y="382" transform="translate(10 10)" font-size="164">NEGOTIATOR</text>
  </g>

  <!-- cream front faces -->
  <g class="word face" font-size="178">
    <text x="98" y="196">SCOPE</text>
    <text x="98" y="382" font-size="164">NEGOTIATOR</text>
  </g>

  <!-- registration mark -->
  <g transform="translate(1038 244)">
    <circle cx="0" cy="0" r="22" fill="#f6f0e7" stroke="#171717" stroke-width="5"/>
    <text x="0" y="9" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="26" fill="#171717">R</text>
  </g>
</svg>
